name: Feature
description: New functionality
labels: ["feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: "What's the feature?"
      placeholder: "Who it's for and what they can do with it"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What's in and what's out
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ] 
    validations:
      required: true
