name: Fix
description: Something is broken
labels: ["fix"]
body:
  - type: textarea
    id: summary
    attributes:
      label: "What's wrong?"
      placeholder: "Steps to reproduce, what happened, what should have happened"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What's in and what's out
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ] 
    validations:
      required: true
